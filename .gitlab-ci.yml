include:
  - project: "observability/shared/gitlab-jobs"
    ref: main
    file:
      - "infra-code-security-scan.yaml"
      - "oss-scan-template-v1.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - security-scan

security-scan:
  extends: oss-scan
  stage: security-scan
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
        when: never # do not run on schedule, we don't want sudden failures without changes in the repo
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        allow_failure: false # fail pipeline if scan job fails
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # run on MRs
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" # run only for MRs against master branch


