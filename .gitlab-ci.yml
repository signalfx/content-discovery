image: alpine:latest

variables:
  GITHUB_API_URL: https://api.github.com/repos/bkanzariya/bits-test
  GITHUB_ACCESS_TOKEN: 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
  FILE_PATH: ootb/bits.yaml
  COMMIT_MESSAGE: "Update file via GitLab CI/CD"

stages:
  - create_or_update_file

create_or_update_file:
  stage: create_or_update_file
  script:
    - apk --update add curl
    - |
      curl -X PUT "$GITHUB_API_URL/contents/$FILE_PATH" \
        -H "Authorization: token $GITHUB_ACCESS_TOKEN" \
        -H "Accept: application/vnd.github.v3+json" \
        --data @- <<EOF
        {
          "message": "$COMMIT_MESSAGE",
          "content": "$(base64 navigators_builtin_content.yaml)",
          "branch": "bits_main"
        }
        EOF
  only:
    - web
