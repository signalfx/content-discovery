# We are still testing this CICD to update the OOTB content details on spreadsheet and as of now it will update
# the "O11y Out of the Box Inventory Test" google spreadsheet. Once we complete 2-3 round of testing to update content
#  based on changes on master branch after that we will update the actual spread sheet name
gsheet:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  # To run this job to just only on master branch
#  rules:
#    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#      when: always
#    - when: never
  script:
    - pip install gspread
    - pip install gspread oauth2client
    - pip install argparse
#    - git clone https://cd.splunkdev.com/observability/shared/content-discovery.git
    - git fetch origin master
    - python o11y_ootb_inventory.py -pki $PRIVATE_KEY_ID -ci $CLIENT_ID -ce $CLIENT_EMAIL -pi $PROJECT_ID -pk $PRIVATE_KEY
