include:
  - file: infra-code-security-scan.yaml
    project: observability/shared/gitlab-jobs
  - file: /prodsec/whitesource-v0.1.0.yaml
    project: ci-cd/templates
    ref: master
  - template: Workflows/MergeRequest-Pipelines.gitlab-ci.yml


stages:
  - code_analysis
  - whitesource

whitesource:
  extends: .whitesource
  stage: whitesource
  variables:
    ws_user_key: ${WHITESOURCE_USER_KEY}
    product_id: ${WHITESOURCE_ID}
    config: generic
  only:
    refs:
      - master
