include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
#  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

variables:
  - UPDATE-INVENTORY: "no"
stages:
  - code_analysis
  - validate-content
  - O11y-Out-of-the-Box-Inventory

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

gsheet:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  rules:
    - if: ($UPDATE-INVENTORY == "yes")
      when: always
    - when: never
# To run only after MR got merged to master branch
#      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - "echo This deploys!"
    - ls -l
    - python --version
    - pip install gspread
    - pip install gspread oauth2client
    - python documentation_tool.py
