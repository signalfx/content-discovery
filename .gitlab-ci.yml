include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

# MergeRequest-Pipelines only allows merge_request_event by default.
# Extend workflow so contentforge bug automation can run from Run pipeline / trigger / ChatOps.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "chat"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
    - if: $OOTB_JIRA_KEY

stages:
  - code_analysis
  - chatops
  - propose-fix
  - validate-content
  - validate-ai-experimental
  - sync-signalbuddy
  - O11y-Out-of-the-Box-Inventory
  - O11y-DOC-OOTB

validate:
  stage: validate-content
  rules:
    - if: $OOTB_JIRA_KEY
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

validate-ai-experimental:
  # Public Docker Hub image (same pull path as python:3 in poll-forge-tickets).
  # The previous internal tag ci-cd/ci-container/node-20-alpine:3.2.1 was
  # removed from Artifactory, so pulls fail with "manifest unknown".
  image: node:20-alpine
  stage: validate-ai-experimental
  rules:
    - if: $OOTB_JIRA_KEY
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - node scripts/bridge_it_validate_content.mjs
  allow_failure: true

# Scheduled poller — bridges Jira → GitLab without needing Jira Automation
# admin. Runs from a scheduled pipeline every ~5 min, finds Forge-created
# BITS tickets that haven't been auto-triaged yet, labels them
# `ootb-auto-triaged` (idempotency lock), and fires one downstream pipeline
# per ticket via the pipeline trigger token.
#
# Gated on POLL_JIRA_TICKETS=true so it only fires on a schedule that
# explicitly opts in, keeping it isolated from other scheduled jobs like
# update-o11y-doc-github.
poll-forge-tickets:
  image: python:3
  stage: chatops
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $POLL_JIRA_TICKETS == "true"
  variables:
    POLL_PROJECT: "BITS"
    # 30 days. Idempotency is enforced by the ootb-auto-triaged label
    # (added on every attempt, never rolled back), so widening the window
    # is safe — already-attempted tickets are filtered out by JQL.
    POLL_WINDOW_MINUTES: "43200"
  script:
    - pip install -r requirement.txt
    - python -m contentforge.pipeline.poll_forge_tickets
  artifacts:
    when: always
    paths:
      - poll_summary.json
    expire_in: 7 days
  allow_failure: false

# OOTB bug automation — Forge creates the Jira ticket upstream, then Jira
# Automation (or the scheduled poller above) triggers this pipeline with
# OOTB_JIRA_KEY. Optional OOTB_BUG_INPUT overrides the bug text (defaults
# to ticket summary).
ootb-bug-fix:
  image: python:3
  stage: chatops
  rules:
    - if: $OOTB_JIRA_KEY
    - if: $CI_PIPELINE_SOURCE == "chat"
  variables:
    GIT_DEPTH: "0"
  script:
    - pip install -r requirement.txt
    - apt-get update && apt-get install -y jq git
    - |
      if [ "$CI_PIPELINE_SOURCE" = "chat" ]; then
        python3 -m contentforge.pipeline.bug_pipeline run --chatops-reply
      else
        python3 -m contentforge.pipeline.bug_pipeline run
      fi
  artifacts:
    when: on_success
    paths:
      - triage.json
    expire_in: 7 days
  allow_failure: false

# Auto-fix stage: reads triage.json produced by ootb-bug-fix, then delegates
# the actual code change to GitLab Duo Agent Platform via the Duo Workflows
# API. The workflow clones the repo, edits the OOTB JSON, and commits back
# to the same branch $BRANCH — updating the draft MR that ootb-bug-fix
# already opened.
#
# allow_failure: false — we want a visible red job if Duo isn't enabled on
# the group, or the token isn't authorized, so we can react instead of
# silently producing empty MRs (which is what the old BridgeIT path was
# doing when it broke).
#
# Requires:
#   CONTENT_FORGE_GIT_TOKEN — GitLab PAT (or Project Access Token) with
#     `api` scope. Must be authorized to trigger Duo Workflows for the
#     content-discovery project.
ootb-duo-fix:
  image: python:3
  stage: propose-fix
  needs:
    - job: ootb-bug-fix
      artifacts: true
  rules:
    - if: $OOTB_JIRA_KEY
    - if: $CI_PIPELINE_SOURCE == "chat"
  variables:
    DUO_WORKFLOW_DEFINITION: "developer/v1"
  script:
    - apt-get update && apt-get install -y --no-install-recommends jq curl
    - test -f triage.json || { echo "triage.json missing from ootb-bug-fix artifacts"; exit 1; }
    - BRANCH=$(jq -r '.branch // empty' triage.json)
    - JIRA_KEY=$(jq -r '.jira_key // empty' triage.json)
    - PRIMARY_FILE=$(jq -r '.primary_file // empty' triage.json)
    - MR_URL=$(jq -r '.mr_url // empty' triage.json)
    - BUG_TEXT=$(jq -r '.bug_text // empty' triage.json)
    - test -n "$JIRA_KEY" || { echo "triage.json has no jira_key"; exit 1; }
    - test -n "$BRANCH"   || { echo "triage.json has no branch"; exit 1; }
    - 'echo "Duo target: $JIRA_KEY on $BRANCH (primary: $PRIMARY_FILE)"'
    # Compose the goal string. Duo reads this as the task description and
    # has repo + git + MR-create privileges by default, so we constrain
    # explicitly to keep the blast radius tight.
    - |
      GOAL=$(cat <<EOF
      Fix the following Splunk Observability OOTB content bug reported in Jira ticket ${JIRA_KEY}.

      ## Bug summary
      ${BUG_TEXT}

      ## Working constraints
      - Check out the existing branch: ${BRANCH}
      - Primary suspect file (heuristic search): ${PRIMARY_FILE}
      - Only modify JSON files under group/, detector/, or navigators/.
      - Do NOT modify hashCode, id, version, or importQualifier fields.
      - Do NOT add or remove top-level keys — value edits only.
      - Prefer the smallest possible change that addresses the bug.
      - Commit to branch ${BRANCH} so the existing draft MR (${MR_URL}) picks up your changes automatically. Do NOT open a new MR.

      ## Acceptance criteria
      - Reported bug is addressed.
      - Existing tests / lint pass (run scripts/validate_content.sh if unsure).
      - File remains valid JSON with the same overall structure.
      EOF
      )
    - |
      REQ_BODY=$(jq -n \
        --arg pid  "$CI_PROJECT_ID" \
        --arg goal "$GOAL" \
        --arg wd   "$DUO_WORKFLOW_DEFINITION" \
        '{project_id: $pid, goal: $goal, workflow_definition: $wd, start_workflow: true}')
      echo "Calling Duo Workflows API..."
      HTTP=$(curl -sS -o duo_workflow_response.json -w "%{http_code}" \
        --request POST \
        --header "PRIVATE-TOKEN: $CONTENT_FORGE_GIT_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$REQ_BODY" \
        "$CI_SERVER_URL/api/v4/ai/duo_workflows/workflows")
      echo "HTTP $HTTP"
      cat duo_workflow_response.json
      echo
      if [ "$HTTP" -ge 400 ]; then
        echo "Duo Workflows trigger failed ($HTTP). Common causes:"
        echo "  - Duo Agent Platform not enabled for the group"
        echo "  - CONTENT_FORGE_GIT_TOKEN lacks 'api' scope or Duo authorization"
        echo "  - workflow_definition '$DUO_WORKFLOW_DEFINITION' not available in this GitLab version"
        exit 1
      fi
      WF_ID=$(jq -r '.id // empty' duo_workflow_response.json)
      echo "Triggered Duo Workflow id=$WF_ID"
  artifacts:
    when: always
    paths:
      - triage.json
      - duo_workflow_response.json
    expire_in: 30 days
  allow_failure: false

# Manual job: push MR JSON changes to Master SignalBuddy and refresh hashCodes.
# Trigger on MRs labeled "sync-signalbuddy". Requires SIGNALBUDDY_TOKEN CI variable.
sync-signalbuddy:
  image: python:3
  stage: sync-signalbuddy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  script:
    - pip install -r requirement.txt
    - apt-get update && apt-get install -y jq git
    - python -m contentforge.syncer.cli plan
    - python -m contentforge.syncer.cli apply --yes --refresh-local
    - |
      if [ -n "$(git status --porcelain -- navigators/ group/ detector/)" ]; then
        git config user.email "ci-bot@content-discovery"
        git config user.name "content-discovery CI"
        git add navigators/ group/ detector/
        git commit -m "chore: refresh hashCode after SignalBuddy sync [skip ci]"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      fi
  allow_failure: false

update-ootb-inventory:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  # To run this job to just only on master branch
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - pip install -r requirement.txt
    - python o11y_ootb_inventory.py -pki $PRIVATE_KEY_ID -ci $CLIENT_ID -ce $CLIENT_EMAIL -pi $PROJECT_ID -pk $PRIVATE_KEY -gpt $GITLAB_API_PRIVATE_TOKEN


variables:
  USER_OR_ORG_NAME:
    value: "splunk"
    description: "Provide user name for which we need to use in GitHub API calls. Default: bkanzariya"
  GITHUB_REPO_NAME:
    value: "o11y-gdi-metadata"
    description: "Provide GitHub repo name on which we need to commit yaml files. Default: bits-test"
  BRANCH_NAME:
    value: "bits-o11y-doc-automation"
    description: "Provide Branch name on which yaml files needs to be committed. Default: o11y-doc-automation"
  GITHUB_FOLDER_NAME:
    value: "ootb"
    description: "Provide folder/path on which yaml files needs to be committed. Please add '-' (dash) in case to commit file on root/main folder  Default: ootb "

update-o11y-doc-github:
  image: python:3
  stage: O11y-DOC-OOTB
  # To run this job to just only on master branch and schedule
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

  script:
    - pip install -r requirement.txt
    - python o11y_ootb_doc_automation.py -pat $GITHUB_PRIVATE_ACCESS_TOKEN -un $USER_OR_ORG_NAME -grn $GITHUB_REPO_NAME -bn $BRANCH_NAME -fn $GITHUB_FOLDER_NAME

