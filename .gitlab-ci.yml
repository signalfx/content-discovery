include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
  - template: "Workflows/MergeRequest-Pipelines.gitlab-ci.yml"

stages:
  - code_analysis
  - validate-content
  - validate-ai-experimental
  - O11y-Out-of-the-Box-Inventory
  - O11y-DOC-OOTB

# --------------------- VALIDATION JOBS ---------------------

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

validate-ai-experimental:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/node-20-alpine:3.2.1
  stage: validate-ai-experimental
  only:
    - merge_requests
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "🔍 Checking for bypass label..."
      MR_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"
      LABELS=$(curl -s --header "JOB-TOKEN: $CI_JOB_TOKEN" "$MR_API" | jq -r '.labels[]?' 2>/dev/null | tr '\n' ' ')

      BYPASS=false
      if echo "$LABELS" | grep -iq 'bypass-ootb-ai-validation'; then
        echo "🟢 Bypass label 'bypass-ootb-ai-validation' found — validation will run but not block merge."
        BYPASS=true
      else
        echo "🧪 Running AI validation — errors/warnings will block merge."
      fi

      # Run the validation
      if node scripts/bridge_it_validate_content.mjs; then
        echo "✅ Validation passed!"
        exit 0
      else
        if [ "$BYPASS" = "true" ]; then
          echo "⚠️ Validation failed, but bypass label is set — not blocking merge."
          exit 0
        else
          echo "❌ Validation failed — blocking merge."
          exit 1
        fi
      fi

# --------------------- INVENTORY & DOC JOBS ---------------------

update-ootb-inventory:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - pip install -r requirement.txt
    - python o11y_ootb_inventory.py \
        -pki $PRIVATE_KEY_ID \
        -ci $CLIENT_ID \
        -ce $CLIENT_EMAIL \
        -pi $PROJECT_ID \
        -pk $PRIVATE_KEY \
        -gpt $GITLAB_API_PRIVATE_TOKEN

variables:
  USER_OR_ORG_NAME:
    value: "splunk"
    description: "Provide user name for GitHub API calls"
  GITHUB_REPO_NAME:
    value: "o11y-gdi-metadata"
    description: "Provide GitHub repo name on which YAML files will be committed"
  BRANCH_NAME:
    value: "bits-o11y-doc-automation"
    description: "Provide Branch name for YAML file commits"
  GITHUB_FOLDER_NAME:
    value: "ootb"
    description: "Provide folder/path for YAML commits"

update-o11y-doc-github:
  image: python:3
  stage: O11y-DOC-OOTB
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - pip install -r requirement.txt
    - python o11y_ootb_doc_automation.py \
        -pat $GITHUB_PRIVATE_ACCESS_TOKEN \
        -un $USER_OR_ORG_NAME \
        -grn $GITHUB_REPO_NAME \
        -bn $BRANCH_NAME \
        -fn $GITHUB_FOLDER_NAME