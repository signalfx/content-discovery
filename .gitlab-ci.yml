include:
  - project: "observability/shared/gitlab-jobs"
    ref: main
    file:
      - "infra-code-security-scan.yaml"
      - "oss-scan-template-v1.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - security-scan

security-scan:
  extends: oss-scan
  only:
    refs:
      - master
