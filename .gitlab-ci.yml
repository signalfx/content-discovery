include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - validate-content
  - validate-ai-experimental
  - publish-content
  - O11y-Out-of-the-Box-Inventory
  - O11y-DOC-OOTB

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

validate-ai-experimental:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/node-20-alpine:3.2.1
  stage: validate-ai-experimental
  except:
    - schedules
  script:
    - node scripts/bridge_it_validate_content.mjs
  allow_failure: true

publish-content-image:
  image: docker.repo.splunkdev.net/ci-cd/ci-container/python-3.12-bookworm:3.6.0
  id_tokens:
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  stage: publish-content
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - |
      #!/usr/bin/env bash
      set -euo pipefail

      creds-helper init

      # CI_COMMIT_BRANCH is only set on branch pipelines, not MR pipelines.
      # Use CI_PIPELINE_SOURCE to distinguish MR builds from master merges.
      if [[ "${CI_PIPELINE_SOURCE}" == "merge_request_event" ]]; then
        # MR build: push to docker-test for validation before merge
        DOCKER_ROLE="docker-test-deployer-role"
        export REGISTRY="docker-test.repo.splunkdev.net"
      else
        # Master merge: push to production registry
        DOCKER_ROLE="docker-deployer-role"
        export REGISTRY="docker.repo.splunkdev.net"
      fi

      # Obtain registry credentials and extract the Basic auth token for curl.
      # creds-helper writes to ~/.docker/config.json; we read it back for curl.
      eval $(creds-helper docker --eval "artifactory:v2/cloud/role/${DOCKER_ROLE}")
      export AUTH_TOKEN=$(python3 -c "
import json
with open('${HOME}/.docker/config.json') as f:
    c = json.load(f)
print(c.get('auths', {}).get('${REGISTRY}', {}).get('auth', ''))
")

      # All packaging and push logic lives in scripts/publish_content_image.sh
      # See that file for step-by-step documentation of the OCI push flow.
      bash scripts/publish_content_image.sh

update-ootb-inventory:
  image: python:3
  stage: O11y-Out-of-the-Box-Inventory
  # To run this job to just only on master branch
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never
  script:
    - pip install -r requirement.txt
    - python o11y_ootb_inventory.py -pki $PRIVATE_KEY_ID -ci $CLIENT_ID -ce $CLIENT_EMAIL -pi $PROJECT_ID -pk $PRIVATE_KEY -gpt $GITLAB_API_PRIVATE_TOKEN


variables:
  USER_OR_ORG_NAME:
    value: "splunk"
    description: "Provide user name for which we need to use in GitHub API calls. Default: bkanzariya"
  GITHUB_REPO_NAME:
    value: "o11y-gdi-metadata"
    description: "Provide GitHub repo name on which we need to commit yaml files. Default: bits-test"
  BRANCH_NAME:
    value: "bits-o11y-doc-automation"
    description: "Provide Branch name on which yaml files needs to be committed. Default: o11y-doc-automation"
  GITHUB_FOLDER_NAME:
    value: "ootb"
    description: "Provide folder/path on which yaml files needs to be committed. Please add '-' (dash) in case to commit file on root/main folder  Default: ootb "

update-o11y-doc-github:
  image: python:3
  stage: O11y-DOC-OOTB
  # To run this job to just only on master branch and schedule
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

  script:
    - pip install -r requirement.txt
    - python o11y_ootb_doc_automation.py -pat $GITHUB_PRIVATE_ACCESS_TOKEN -un $USER_OR_ORG_NAME -grn $GITHUB_REPO_NAME -bn $BRANCH_NAME -fn $GITHUB_FOLDER_NAME
