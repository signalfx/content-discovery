include:
  - project: "observability/shared/gitlab-jobs"
    file: "infra-code-security-scan.yaml"
  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - validate-content

build:
  stage: validate-content
  except:
    - schedules
  script:
    - echo $CI_COMMIT_BRANCH
    - echo $CI_DEFAULT_BRANCH
    - CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH /bin/bash scripts/validate_content_ci.sh
