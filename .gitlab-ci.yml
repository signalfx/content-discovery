include:
  - project: "observability/shared/gitlab-jobs"
    ref: 1.0.65
    file: "sast-scan-template.yml"
#  - template: 'Workflows/MergeRequest-Pipelines.gitlab-ci.yml'

stages:
  - code_analysis
  - validate-content
  - update-gsheet

validate:
  stage: validate-content
  except:
    - schedules
  script:
    - CI_MR_TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME /bin/bash scripts/validate_content.sh

gsheet:
  image: python:3
  stage: update-gsheet
  rules:
# To run only after MR got merged to master branch
#      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - "echo This deploys!"
    - ls -l
    - "python --version"
    - "pip install gspread oauth2client"
  artifacts:
    paths:
      - script/*.sh
    expire_in: 1 week
