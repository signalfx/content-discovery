# Copy this file to configs/content-maintainer.local.yaml and fill in the values.
# Do not store API tokens, passwords, cookies, or private keys here.

jira:
  site_url: "https://splunk.atlassian.net"
  jql: "created >= -30d AND project = BITS AND type = Bug ORDER BY created DESC"
  ready_for_verification_transition: "Ready for verification"
  owner_emails:
    - ashokshah@splunk.com
    - hisingh@splunk.com
    - svashisth@splunk.com
    - punitu@splunk.com

gitlab:
  project_url: "https://cd.splunkdev.com/observability/shared/content-discovery"
  reviewers:
    - ashokshah
    - hisingh
    - punitu
    - svashisth

limits:
  max_new_tickets_per_run: 1
  max_changed_files_per_ticket: 10
  max_diff_lines_per_ticket: 1000
  reminder_interval_hours: 24

allowed_repository_paths:
  - navigators/
  - detector/
  - group/
  - content_release_notes.yaml

remote_writes:
  jira_comments: true
  jira_ready_for_verification_transition: true
  gitlab_branches_and_merge_requests: true
  signalbuddy_updates_and_exports: true
