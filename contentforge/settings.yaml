# Committed defaults for OOTB bug automation (no secrets).
# Override locally with contentforge/config.yaml (gitignored) or CI variables.

slack:
  channel_name: test_ai_ootb
  # channel_id: set via SLACK_CHANNEL_ID in CI when using bot API
  # owner_mentions: Slack user IDs to @mention on completion (e.g. ["U01234567"])
  owner_mentions: []

jira:
  base_url: https://splunk.atlassian.net
  cloud_id: db16805d-eccf-473e-abd4-5c291f63e55d
  project_key: BITS
  issue_type: Bug
  default_labels:
    - o11y-ootb
    - content-discovery
    - ai-automation

gitlab:
  base_url: https://cd.splunkdev.com
  project_path: observability/shared/content-discovery
  project_id: 9336
  target_branch: master
  default_labels:
    - o11y-ootb
    - ai-automation
  default_reviewer_ids: []
  # GitLab user id of the Duo Agent Platform service account that a
  # "Assign" flow trigger is bound to. When the pipeline creates the
  # triage issue it assigns to this user so the Flow fires and does the
  # actual code fix + MR. Override with DUO_FLOW_ASSIGNEE_ID CI variable.
  duo_flow_assignee_id: null

signalbuddy:
  realm: us0

workflow:
  branch_prefix: fix/bits-
  mr_draft: true
  # Set OOTB_SYNC_MSB=true in CI to push JSON to Master SignalBuddy after changes exist
  sync_master_on_change: false
  # Slack Workflow (test without merging to master): see contentforge/slack-workflow/SETUP.md
  trigger_keyword: "ootb-bug:"
  pipeline_branch: lab
