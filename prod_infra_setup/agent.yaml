# Default configuration file for the Linux (deb/rpm) and Windows MSI collector packages

# If the collector is installed without the Linux/Windows installer script, the following
# environment variables are required to be manually defined or configured below:
# - SPLUNK_ACCESS_TOKEN: The Splunk access token to authenticate requests
# - SPLUNK_API_URL: The Splunk API URL, e.g. https://api.us0.signalfx.com
# - SPLUNK_BUNDLE_DIR: The path to the Smart Agent bundle, e.g. /usr/lib/splunk-otel-collector/agent-bundle
# - SPLUNK_COLLECTD_DIR: The path to the collectd config directory for the Smart Agent, e.g. /usr/lib/splunk-otel-collector/agent-bundle/run/collectd
# - SPLUNK_HEC_TOKEN: The Splunk HEC authentication token
# - SPLUNK_HEC_URL: The Splunk HEC endpoint URL, e.g. https://ingest.us0.signalfx.com/v1/log
# - SPLUNK_INGEST_URL: The Splunk ingest URL, e.g. https://ingest.us0.signalfx.com
# - SPLUNK_TRACE_URL: The Splunk trace endpoint URL, e.g. https://ingest.us0.signalfx.com/v2/trace

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  http_forwarder:
    ingress:
      endpoint: 0.0.0.0:6060
    egress:
      endpoint: "${SPLUNK_API_URL}"
      # Use instead when sending to gateway
      #endpoint: "${SPLUNK_GATEWAY_URL}"
  smartagent:
    bundleDir: "${SPLUNK_BUNDLE_DIR}"
    collectd:
      configDir: "${SPLUNK_COLLECTD_DIR}"
  zpages:
    #endpoint: 0.0.0.0:55679
  memory_ballast:
    # In general, the ballast should be set to 1/3 of the collector's memory, the limit
    # should be 90% of the collector's memory.
    # The simplest way to specify the ballast size is set the value of SPLUNK_BALLAST_SIZE_MIB env variable.
    size_mib: ${SPLUNK_BALLAST_SIZE_MIB}

receivers:
  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    node_conditions_to_report: ["Ready", "MemoryPressure"]
    allocatable_types_to_report: ["cpu", "memory"]
    metadata_exporters: [signalfx]
  smartagent/redis:
    type: collectd/redis
    host: 10.244.2.12
    port: 6379
    sendListLengths:
      - databaseIndex: 0
        keyPattern: "*"
  smartagent/mysql:
    type: collectd/mysql
    host: 10.244.2.25
    port: 3306
    databases:
      - name: bits_data
    username: root
    password: password
  smartagent/kubernetes-apiserver:
    type: kubernetes-apiserver
    host: localhost
    port: 6443
    useHTTPS: true
    sendAllMetrics: true
    skipVerify: true
    extraDimensions:
      metric_source: kubernetes-apiserver
      service.name: k8s-api
  smartagent/kubernetes-events:
    type: kubernetes-events
    kubernetesAPI:
      authType: serviceAccount
    whitelistedEvents:
      - reason: Created
        involvedObjectKind: Pod
      - reason: SuccessfulCreate
        involvedObjectKind: ReplicaSet
    extraDimensions:
      service.name: k8s-events
  smartagent/kubernetes-cluster:
    type: kubernetes-cluster
    alwaysClusterReporter: true
    kubernetesAPI:
      authType: serviceAccount
      clientKeyPath: /etc/kubernetes/pki/apiserver.key
      clientCertPath: /etc/kubernetes/pki/apiserver.crt
      caCertPath: /etc/kubernetes/pki/ca.crt
    extraDimensions:
      service.name: k8s-cluster
  #    extraMetrics:
  #        - '*'
  fluentforward:
    endpoint: 127.0.0.1:8006
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
      memory:
      network:
      # System load average metrics https://en.wikipedia.org/wiki/Load_(computing)
      load:
      # Paging/Swap space utilization and I/O metrics
      paging:
      # Aggregated system process count metrics
      processes:
      # System processes metrics, disabled by default
      # process:
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # This section is used to collect the OpenTelemetry Collector metrics
  # Even if just a Splunk APM customer, these metrics are included
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          scrape_interval: 10s
          static_configs:
            - targets: ["0.0.0.0:8888"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: ".*grpc_io.*"
              action: drop
  smartagent/signalfx-forwarder:
    type: signalfx-forwarder
    listenAddress: 0.0.0.0:9080
  signalfx:
    endpoint: 0.0.0.0:9943
    # Whether to preserve incoming access token and use instead of exporter token
    # default = false
    #access_token_passthrough: true
  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:
  # Enabling the memory_limiter is strongly recommended for every pipeline.
  # Configuration is based on the amount of memory allocated to the collector.
  # For more information about memory limiter, see
  # https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiter/README.md
  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}

  # Detect if the collector is running on a cloud system, which is important for creating unique cloud provider dimensions.
  # Detector order is important: the `system` detector goes last so it can't preclude cloud detectors from setting host/os info.
  # Resource detection processor is configured to override all host and cloud attributes because instrumentation
  # libraries can send wrong values from container environments.
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourcedetectionprocessor#ordering
  resourcedetection:
    detectors: [gce, ecs, ec2, azure, system, env]
    override: true
  resource/add_environment:
    attributes:
      - action: insert
        value: api_test
        key: deployment.environment
      - action: insert
        value: trickerapp_java
        key: sf_service
      - action: insert
        value: api_test
        key: sf_environment
  resource:
    attributes:
      - action: insert
        key: kubernetes_cluster
        value: kubernetes-bits-production
    #attributes:
    #- action: insert
    #value: staging/production/...
    #key: deployment.environment

exporters:
  # Traces
  sapm:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    endpoint: "${SPLUNK_TRACE_URL}"
  # Metrics + Events
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    api_url: "${SPLUNK_API_URL}"
    ingest_url: "${SPLUNK_INGEST_URL}"
    # Use instead when sending to gateway
    #api_url: http://${SPLUNK_GATEWAY_URL}:6060
    #ingest_url: http://${SPLUNK_GATEWAY_URL}:9943
    sync_host_metadata: true
    correlation:
      sync_attributes:
        {
          "host.name": "host.name",
          "sf_service": "OTEL_SERVICE_NAME",
          "sf_environment": "deployment.environment",
        }
  signalfx/sfdemo:
    access_token: "${SF_SPLUNK_ACCESS_TOKEN}"
    api_url: "${SF_SPLUNK_API_URL}"
    ingest_url: "${SF_SPLUNK_INGEST_URL}"
  # Logs
  splunk_hec:
    token: "${SPLUNK_HEC_TOKEN}"
    endpoint: "${SPLUNK_HEC_URL}"
    source: "otel"
    sourcetype: "otel"
  # Send to gateway
  otlp:
    endpoint: "${SPLUNK_GATEWAY_URL}:4317"
    tls:
      insecure: true
  # Debug
  logging:
    loglevel: debug
  file:
    path: /var/log/otelcol.json
service:
  extensions: [health_check, http_forwarder, zpages, memory_ballast]
  pipelines:
    metrics:
      #   receivers: [smartagent/kubelet-stats]
      receivers:
        [
          smartagent/mysql,
          smartagent/redis,
          k8s_cluster,
          smartagent/kubernetes-apiserver,
          hostmetrics,
          otlp,
          signalfx,
          smartagent/signalfx-forwarder,
          smartagent/kubernetes-cluster,
          smartagent/kubernetes-events,
        ]
      processors:
        [
          resource,
          memory_limiter,
          batch,
          resourcedetection,
          resource/add_environment,
        ]
      exporters: [signalfx, logging]
